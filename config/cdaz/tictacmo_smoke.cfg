# Paired smoke-test configuration for conventional multiplayer AlphaZero and
# Certified-Deviation AlphaZero. The experiment script overrides only the
# policy-target mode and reference-anchor loss.

program_seed=17
program_auto_seed=false
program_quiet=true

actor_num_simulation=24
actor_multiplayer_search_type=maxn
actor_policy_target_type=visit
actor_select_action_by_count=false
actor_select_action_by_softmax_count=true
actor_select_action_softmax_temperature=1
actor_use_random_rotation_features=true
actor_use_dirichlet_noise=true
actor_dirichlet_noise_alpha=0.08
actor_dirichlet_noise_epsilon=0.25
actor_use_gumbel=false
actor_mcts_value_rescale=false
actor_deviation_temperature=0.15
actor_deviation_kl_budget=0.2
actor_deviation_confidence_scale=0.5
actor_deviation_variance_prior=0.1
actor_deviation_prior_count=1

zero_num_threads=2
zero_num_parallel_games=8
zero_num_games_per_iteration=128
zero_replay_buffer=4
zero_disable_resign_ratio=1
zero_actor_intermediate_sequence_length=0
zero_server_accept_different_model_games=true

learner_training_step=50
learner_training_display_step=25
learner_batch_size=128
learner_optimizer=Adam
learner_learning_rate=0.001
learner_weight_decay=0
learner_value_loss_scale=1
learner_policy_reference_loss_scale=0
learner_num_thread=2

nn_num_blocks=2
nn_num_hidden_channels=64
nn_num_value_hidden_channels=64
nn_type_name=alphazero

env_board_size=5
